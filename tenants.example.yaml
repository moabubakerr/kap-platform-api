# KAP tenants managed by the platform layer, and how it signs in to KAP for each.
# No secrets here: each auth block names the environment variable that holds them.
#
# m2m   — KAP service account + OAuth client (POST /oauth/token). Requires KAP's
#         M2M installation parameter to be enabled. Preferred.
# token — legacy KAP user API token (admin panel → user → Create API Token).
tenants:
  - id: 71b6c98a-7f7a-4a8b-ab31-132c85bdc88b
    name: sandbox
    auth:
      type: token
      token_env: KAP_TOKEN_SANDBOX
